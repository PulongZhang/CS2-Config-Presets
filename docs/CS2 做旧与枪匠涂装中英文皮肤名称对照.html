const zh=r=>r.zh||'';
const normalize=s=>String(s||'').normalize('NFKC').toLowerCase().replace(/[\s\-_.,，。·()（）|\/\\]+/g,'');
const escapeHTML=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const totalDone=ROWS.filter(r=>!!zh(r)).length;
$('done').textContent=totalDone;$('todo').textContent=ROWS.length-totalDone;
function view(){
 const search=normalize($('q').value),category=$('category').value,rank=$('rank').value;
 const subset=ROWS.map((r,i)=>({...r,orig:i+1,zh:zh(r)})).filter(r=>(!category||r.category===category)&&(!rank||r.rating===rank)&&(!search||normalize(r.weapon+' '+r.english+' '+r.zh).includes(search)));
 $('shown').textContent='当前显示 '+subset.length+' / '+ROWS.length+' 条记录';
 let buff='',lastCat='',lastWeapon='';
 for(const r of subset){
   if(r.category!==lastCat){if(lastCat)buff+='</tbody></table></div></section>';buff+='<section><h2 class="section-title">'+escapeHTML(r.category)+'</h2>';lastCat=r.category;lastWeapon='';}
   if(r.weapon!==lastWeapon){if(lastWeapon)buff+='</tbody></table></div>';lastWeapon=r.weapon;buff+='<div class="group"><div class="group-head"><h3>'+escapeHTML(r.weapon==='Knife (all types)'?'全部刀型通用涂装':r.weapon)+'</h3><small>原文分类顺序</small></div><table><thead><tr><th>#</th><th>中文名称</th><th>英文名称</th><th>评级</th></tr></thead><tbody>';}
   const isRemoved=/^已从游戏中移除/.test(r.zh);
   buff+='<tr><td>'+r.orig+'</td><td class="cn'+(isRemoved?' missing':'')+'">'+escapeHTML(r.zh)+(isRemoved?'<span class="status">条目已下线</span>':'')+'</td><td class="en">'+escapeHTML(r.english)+'</td><td><span class="rating '+(r.rating==='V'?'very':r.rating==='IV'?'high':'')+'">'+r.rating+'</span></td></tr>';
 }
 if(lastWeapon)buff+='</tbody></table></div></section>';
 $('root').innerHTML=buff||'<div class="empty">没有找到匹配的皮肤，请修改筛选条件。</div>';
}
for(const id of ['q','category','rank']) $(id).addEventListener(id==='q'?'input':'change',view);
$('reset').addEventListener('click',()=>{$('q').value='';$('category').value='';$('rank').value='';view()});
$('csv').addEventListener('click',()=>{
 const q=x=>'"'+String(x??'').replace(/"/g,'""')+'"';
 let s='编号,分类,武器,中文名称,英文名称,视觉变化评级\r\n';
 ROWS.forEach((r,i)=>s+=[i+1,r.category,r.weapon,zh(r),r.english,r.rating].map(q).join(',')+'\r\n');
 const url=URL.createObjectURL(new Blob(['\ufeff'+s],{type:'text/csv;charset=utf-8'}));
 const a=document.createElement('a');a.href=url;a.download='CS2_做旧与枪匠涂装_静态中英对照.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
});
view();
</script>
</body></html>
